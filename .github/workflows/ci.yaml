name: ci
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      hivemq:
        image: hivemq/hivemq-ce:2023.9
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.x'

      - name: Build
        run: go build -v ./...

      - name: Run Test
        env:
          MQTT_BROKER_URL: "tcp://localhost:1883"
        run: go test -race -v -covermode atomic -coverprofile=covprofile ./...

      - name: Install goveralls
        run: go install github.com/mattn/goveralls@latest

      - name: Send coverage
        env:
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        # exclude the example app and generated protobuf code from the
        # coverage report: they are never tested, so line-count churn in
        # them shifts the ratio and trips Coveralls' fail-on-decrease check
        run: |
          grep -vE '^github\.com/EvergenEnergy/sparkplughost/(examples|protobuf)/' covprofile > covprofile.filtered
          goveralls -coverprofile=covprofile.filtered -service=github

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
